<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142e30"><title>Nine Lives Above — a gravity cat puzzle</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><span class="eyebrow">A LITTLE CAT. A DIFFERENT WAY UP.</span><h1>Nine Lives Above<span class="star">✦</span></h1></div><nav aria-label="Game controls"><button id="rooms">Rooms</button><button id="sound" aria-pressed="false">Sound off</button><button id="pause">Pause</button></nav></header>
<section class="game-shell" aria-label="Gravity puzzle game"><div class="room-bar"><span id="room-number">ROOM 01 / 12</span><strong id="room-title"></strong><span id="seal-count">☾ 0 / 1</span></div><div class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Game room. Left and right arrows or A and D to walk. Space to invert gravity. R to restart. Escape to pause."></canvas><div id="overlay" hidden></div></div><div class="bottom-bar"><span id="gravity">↓ FLOOR SIDE</span><span id="message" role="status" aria-live="polite"></span><button id="restart">↻ Restart <kbd>R</kbd></button></div></section>
<div class="instructions"><p><kbd>←</kbd><kbd>→</kbd> move <span class="divider">/</span> <kbd>SPACE</kbd> flip gravity <span class="divider">/</span> collect the moons. Find your way home.</p><button id="hint">Need a hint?</button></div><p id="hint-text" hidden></p>
<div class="touch" aria-label="Touch controls"><button id="left" aria-label="Move left">←</button><button id="flip">Flip gravity ↑↓</button><button id="right" aria-label="Move right">→</button></div><footer><span>TAKE YOUR TIME. CURIOSITY HAS NINE LIVES.</span><span id="progress">THE MOONHOUSE · 12 ROOMS</span></footer></main><script src="src/engine.js"></script><script src="src/levels.js"></script><script src="src/progress.js"></script><script src="src/render.js"></script><script src="src/app.js"></script></body></html>
